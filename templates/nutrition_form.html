<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Advice - FitAI Coach</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h1 { color: #333; text-align: center; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: bold; }
        select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        button:hover { background-color: #218838; }
        .result { margin-top: 20px; padding: 15px; background-color: #e9ecef; border-radius: 5px; }
        .error { margin-top: 20px; padding: 15px; background-color: #f8d7da; color: #721c24; border-radius: 5px; text-align: center; }
        a { color: #007bff; text-decoration: none; display: block; text-align: center; margin-top: 20px;}
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Get Your Personalized Nutrition Advice</h1>
        <form id="nutritionForm">
            <label for="goal">Fitness Goal:</label>
            <select id="goal" name="goal" required>
                <option value="Weight Loss">Weight Loss</option>
                <option value="Muscle Gain">Muscle Gain</option>
                <option value="Maintenance">Maintenance</option>
            </select>

            <label for="dietary_habits">Dietary Habits:</label>
            <select id="dietary_habits" name="dietary_habits" required>
                <option value="Balanced">Balanced</option>
                <option value="High Protein">High Protein</option>
                <option value="Low Carb">Low Carb</option>
            </select>

            <button type="submit">Get Nutrition Advice</button>
        </form>
        <div id="nutritionResult" class="result" style="display:none;"></div>
        <div id="nutritionError" class="error" style="display:none;"></div>
        <a href="/">Back to Home</a>
    </div>

    <script>
        document.getElementById('nutritionForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const data = Object.fromEntries(formData.entries());

            const resultDiv = document.getElementById('nutritionResult');
            const errorDiv = document.getElementById('nutritionError');
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/get_nutrition', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                const responseData = await response.json();
                if (response.ok) {
                    resultDiv.textContent = responseData.nutrition_advice;
                    resultDiv.style.display = 'block';
                } else {
                    errorDiv.textContent = 'Error: ' + (responseData.error || 'Could not fetch nutrition advice.');
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Network Error: ' + error.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
